name: ifl-upstream
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  trial-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Newest stable upstream tag not yet merged
        id: tag
        run: |
          git remote add upstream https://github.com/mattermost/desktop.git
          git fetch --quiet upstream 'refs/tags/v*:refs/tags/v*'
          TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if git merge-base --is-ancestor "$TAG" HEAD; then echo "tag=" >> "$GITHUB_OUTPUT"; else echo "tag=$TAG" >> "$GITHUB_OUTPUT"; fi
      - name: Trial merge
        if: steps.tag.outputs.tag != ''
        id: merge
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name ifl-upstream
          git config user.email ifl-upstream@users.noreply.github.com
          if git merge --no-edit "$TAG"; then
            echo "result=merges cleanly" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflicts in $(git diff --name-only --diff-filter=U | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.merge.outputs.result == 'merges cleanly'
        with:
          node-version-file: .nvmrc
      - name: Checks on the merge
        if: steps.merge.outputs.result == 'merges cleanly'
        id: checks
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y libxtst-dev libpng++-dev
          if npm ci && npm run check-types && npm run test:unit && npm run build-prod && npx electron-builder --linux tar.gz --x64 --publish=never; then
            echo "result=checks and an unsigned Linux build pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=checks FAIL (see the run log)" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the issue
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          MERGE: ${{ steps.merge.outputs.result }}
          CHECKS: ${{ steps.checks.outputs.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Upstream $TAG"
          BODY="Mattermost Desktop $TAG: $MERGE. ${CHECKS:-checks not run}. Run: $RUN. Merge on a workstation (IFL.md, Upstream releases)."
          N=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body "$BODY"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
